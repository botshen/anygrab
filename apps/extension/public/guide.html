<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyGrab — 30 秒实战指南与在线练习靶场</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141413'/%3E%3Cpath d='M8.5 12.5V8.5H12.5M19.5 8.5H23.5V12.5M23.5 19.5V23.5H19.5M12.5 23.5H8.5V19.5' stroke='%23FAF9F5' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Crect x='13.5' y='13.5' width='5' height='5' rx='1' fill='%23D94E28'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --ag-bg-canvas: #F5F4EF;
        --ag-bg-surface: #FFFFFF;
        --ag-bg-subtle: #ECEAE3;
        --ag-bg-stage: #141413;
        --ag-bg-stage-elevated: #1F1F1D;
        --ag-border: #DFDDD4;
        --ag-border-strong: #C7C4B8;
        --ag-text-primary: #141413;
        --ag-text-secondary: #52514C;
        --ag-text-muted: #78766F;
        --ag-accent: #D94E28;
        --ag-accent-soft: rgba(217, 78, 40, 0.09);
        --ag-success: #15803D;
        --ag-font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        --ag-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --ag-radius-lg: 12px;
        --ag-radius-md: 8px;
        --ag-radius-sm: 5px;
        --arena-cta: #D94E28;
        --arena-cta-hover: #B83D1B;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background-color: var(--ag-bg-canvas);
        color: var(--ag-text-primary);
        font-family: var(--ag-font-sans);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1, h2, h3 {
        text-wrap: balance;
      }

      .ag-guide-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 28px 68px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      /* Open Top Bar directly on Archival Paper (Shared Left Anchor x=0) */
      .ag-guide-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--ag-border);
        flex-wrap: wrap;
      }

      .ag-nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .ag-nav-logo {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
      }

      .ag-nav-title {
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.025em;
        color: var(--ag-text-primary);
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        white-space: nowrap;
      }

      .ag-nav-version {
        font-family: var(--ag-font-mono);
        font-weight: 500;
        font-size: 11px;
        color: var(--ag-text-muted);
      }

      /* Quiet engineering text — NOT a fake button border! */
      .ag-nav-meta {
        font-family: var(--ag-font-mono);
        font-size: 11.5px;
        color: var(--ag-text-muted);
        padding-left: 10px;
        border-left: 1px solid var(--ag-border-strong);
        white-space: nowrap;
      }

      .ag-nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .ag-btn-outline {
        appearance: none;
        border: 1px solid var(--ag-border-strong);
        background: var(--ag-bg-surface);
        color: var(--ag-text-primary);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: var(--ag-radius-md);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: background 120ms ease, border-color 120ms ease;
      }

      .ag-btn-outline:hover {
        background: var(--ag-bg-subtle);
      }

      /* Unified Segmented Locale Switcher matching Website & Popup */
      .ag-seg-locale {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: var(--ag-radius-md);
        border: 1px solid var(--ag-border);
        background: var(--ag-bg-subtle);
        font-family: inherit;
        cursor: pointer;
      }

      .ag-seg-locale-item {
        padding: 4px 9px;
        border-radius: var(--ag-radius-sm);
        font-size: 12px;
        line-height: 1;
        font-weight: 500;
        color: var(--ag-text-secondary);
        transition: background 120ms ease, color 120ms ease;
      }

      .ag-seg-locale-item[data-active="true"] {
        background: #FFFFFF;
        color: #141413;
        font-weight: 650;
        box-shadow: 0 1px 2px rgba(20, 20, 19, 0.08);
      }

      /* Compact Left-Aligned Masthead so Practice Arena sits inside 0-900px First Fold */
      .ag-hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }

      .ag-hero-main {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        max-width: 740px;
      }

      .ag-hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--ag-font-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--ag-accent);
      }

      .ag-hero-badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 1.5px;
        background: var(--ag-accent);
      }

      .ag-hero-title {
        font-size: clamp(21px, 2.4vw, 27px);
        font-weight: 750;
        letter-spacing: -0.025em;
        color: var(--ag-text-primary);
        line-height: 1.4;
      }

      .ag-hero-sub {
        font-size: 13.5px;
        color: var(--ag-text-secondary);
        line-height: 1.62;
      }

      .ag-btn-primary {
        appearance: none;
        border: 1px solid #141413;
        background: #141413;
        color: #FFFFFF;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: var(--ag-radius-md);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        transition: background 120ms ease, border-color 120ms ease, transform 100ms ease;
      }

      .ag-btn-primary:hover {
        background: #262624;
        border-color: #262624;
      }

      .ag-btn-primary:active {
        transform: scale(0.994);
      }

      /* Optical Viewfinder Framed Practice Arena (First-Fold Protagonist!) */
      .ag-arena-section {
        position: relative;
        padding: 20px 22px 22px;
        border-radius: var(--ag-radius-lg);
        background: var(--ag-bg-surface);
        border: 1.5px solid var(--ag-border-strong);
        box-shadow: 0 18px 44px -26px rgba(20, 20, 19, 0.16);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* 4 Bold Vermilion Optical Viewfinder L-Brackets */
      .ag-reticle-bracket {
        position: absolute;
        width: 16px;
        height: 16px;
        pointer-events: none;
      }
      .ag-rb-tl {
        top: -2px;
        left: -2px;
        border-top: 3px solid var(--ag-accent);
        border-left: 3px solid var(--ag-accent);
        border-top-left-radius: 4px;
      }
      .ag-rb-tr {
        top: -2px;
        right: -2px;
        border-top: 3px solid var(--ag-accent);
        border-right: 3px solid var(--ag-accent);
        border-top-right-radius: 4px;
      }
      .ag-rb-bl {
        bottom: -2px;
        left: -2px;
        border-bottom: 3px solid var(--ag-accent);
        border-left: 3px solid var(--ag-accent);
        border-bottom-left-radius: 4px;
      }
      .ag-rb-br {
        bottom: -2px;
        right: -2px;
        border-bottom: 3px solid var(--ag-accent);
        border-right: 3px solid var(--ag-accent);
        border-bottom-right-radius: 4px;
      }

      .ag-arena-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }

      .ag-arena-eyebrow {
        font-family: var(--ag-font-mono);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--ag-accent);
        margin-bottom: 2px;
      }

      .ag-arena-title {
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.02em;
        color: var(--ag-text-primary);
        line-height: 1.38;
      }

      .ag-arena-sub {
        font-size: 13px;
        color: var(--ag-text-secondary);
        max-width: 720px;
        margin-top: 2px;
        line-height: 1.6;
      }

      .ag-capture-feedback {
        padding: 10px 14px;
        border-radius: var(--ag-radius-md);
        background: var(--ag-bg-canvas);
        border: 1px dashed var(--ag-border-strong);
        color: var(--ag-text-secondary);
        font-size: 12.5px;
        line-height: 1.6;
      }

      .ag-capture-feedback[data-captured="true"] {
        background: #F4FAF6;
        border: 1px solid rgba(21, 128, 61, 0.34);
        color: var(--ag-text-primary);
      }

      .ag-capture-success-title {
        font-weight: 700;
        font-size: 13.5px;
        color: var(--ag-success);
        line-height: 1.45;
      }

      .ag-capture-success-next {
        margin-top: 2px;
        font-size: 12.5px;
        color: var(--ag-text-secondary);
        line-height: 1.6;
      }

      .ag-capture-preview {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: var(--ag-radius-md);
        background: var(--ag-bg-stage);
        border: 1px solid #2A2A27;
        color: #ECEAE3;
        font-family: var(--ag-font-mono);
        font-size: 11.5px;
        line-height: 1.55;
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .ag-arena-targets {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 18px;
        align-items: start;
      }

      .ag-arena-targets > *,
      .ag-target-wrapper {
        min-width: 0;
        max-width: 100%;
      }

      .ag-target-wrapper {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .ag-target-meta {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .ag-target-badge {
        display: inline-block;
        align-self: flex-start;
        font-family: var(--ag-font-mono);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 2px 7px;
        border-radius: var(--ag-radius-sm);
        background: var(--ag-accent-soft);
        color: var(--ag-accent);
      }

      .ag-target-label {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ag-text-primary);
        line-height: 1.42;
      }

      .ag-target-tip {
        font-size: 12px;
        color: var(--ag-text-secondary);
        line-height: 1.58;
      }

      /* Practice Target 1: Sharp Matte Carbon SaaS Pro Card */
      .practice-pricing-card {
        padding: 20px;
        border-radius: var(--ag-radius-lg);
        background: #141413;
        border: 1px solid #2A2A27;
        box-shadow: 0 10px 26px rgba(20, 20, 19, 0.1);
        display: flex;
        flex-direction: column;
        gap: 13px;
      }

      .pricing-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .pricing-tier-name {
        font-size: 17px;
        font-weight: 750;
        color: #FFFFFF;
        line-height: 1.38;
      }

      .pricing-pop-pill {
        padding: 2px 8px;
        border-radius: var(--ag-radius-sm);
        background: rgba(217, 78, 40, 0.16);
        border: 1px solid rgba(217, 78, 40, 0.38);
        color: #F58466;
        font-family: var(--ag-font-mono);
        font-size: 10.5px;
        font-weight: 600;
        white-space: nowrap;
      }

      .pricing-amount {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .pricing-price {
        font-family: var(--ag-font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 28px;
        font-weight: 750;
        color: #FFFFFF;
        line-height: 1.15;
      }

      .pricing-period {
        font-size: 12.5px;
        color: #A8A69E;
      }

      .pricing-features {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
        color: #E5E4DF;
        line-height: 1.52;
      }

      .pricing-feature-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .practice-cta-btn {
        appearance: none;
        width: 100%;
        padding: 10px 14px;
        border-radius: var(--ag-radius-md);
        border: none;
        background-color: var(--arena-cta);
        color: #FFFFFF;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 650;
        cursor: pointer;
        transition: background-color 140ms ease;
      }

      .practice-cta-btn:hover {
        background-color: var(--arena-cta-hover);
      }

      /* Practice Target 2: Merged-Header Enterprise Financial Ledger */
      .practice-table-card {
        padding: 14px;
        border-radius: var(--ag-radius-lg);
        background: #FFFFFF;
        border: 1px solid var(--ag-border);
        overflow-x: auto;
      }

      .practice-merged-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
        color: var(--ag-text-primary);
        font-variant-numeric: tabular-nums;
      }

      .practice-merged-table th,
      .practice-merged-table td {
        border: 1px solid var(--ag-border);
        padding: 9px 10px;
        text-align: left;
      }

      /* Prevent orphan character wraps on row labels */
      .practice-merged-table th:first-child,
      .practice-merged-table td:first-child {
        white-space: nowrap;
      }

      .practice-merged-table thead th {
        background: #ECEAE3;
        color: #141413;
        font-weight: 650;
      }

      .practice-merged-table tbody td {
        background: #FFFFFF;
      }

      .practice-growth-pill {
        display: inline-block;
        padding: 2px 6px;
        border-radius: var(--ag-radius-sm);
        background: rgba(21, 128, 61, 0.1);
        color: var(--ag-success);
        font-family: var(--ag-font-mono);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 11px;
        white-space: nowrap;
      }

      /* Open Archival Sections Below Arena: Zero Outer Box Nesting, Shared Left Anchor x=0 */
      .ag-open-section {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-top: 4px;
      }

      .ag-section-heading {
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.02em;
        color: var(--ag-text-primary);
        line-height: 1.4;
      }

      .ag-steps-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .ag-step-card {
        padding-top: 14px;
        border-top: 2px solid #141413;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .ag-step-card[data-accent="true"] {
        border-top-color: var(--ag-accent);
      }

      .ag-step-num {
        font-family: var(--ag-font-mono);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 11.5px;
        color: #141413;
      }

      .ag-step-num[data-accent="true"] {
        color: var(--ag-accent);
      }

      .ag-step-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ag-text-primary);
        line-height: 1.42;
      }

      .ag-step-desc {
        font-size: 13px;
        color: var(--ag-text-secondary);
        line-height: 1.65;
      }

      .ag-prompts-head {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .ag-prompts-hint {
        font-size: 13px;
        color: var(--ag-text-secondary);
        line-height: 1.6;
      }

      .ag-prompts-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .ag-prompt-card {
        padding: 15px 16px;
        border-radius: var(--ag-radius-md);
        background: var(--ag-bg-surface);
        border: 1px solid var(--ag-border);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
      }

      .ag-prompt-label {
        font-size: 13.5px;
        font-weight: 650;
        color: var(--ag-text-primary);
        line-height: 1.42;
      }

      .ag-prompt-text {
        font-size: 12.5px;
        color: var(--ag-text-secondary);
        line-height: 1.62;
        margin-top: 4px;
      }

      .ag-prompt-copy {
        align-self: flex-start;
        appearance: none;
        border: 1px solid var(--ag-border-strong);
        background: var(--ag-bg-canvas);
        color: var(--ag-text-primary);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 11px;
        border-radius: var(--ag-radius-sm);
        cursor: pointer;
        white-space: nowrap;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      .ag-prompt-copy:hover {
        background: #141413;
        border-color: #141413;
        color: #FFFFFF;
      }

      .ag-prompt-copy[data-copied="true"] {
        background: rgba(21, 128, 61, 0.1);
        border-color: rgba(21, 128, 61, 0.35);
        color: var(--ag-success);
      }

      @media (max-width: 860px) {
        .ag-steps-grid,
        .ag-arena-targets,
        .ag-prompts-grid {
          grid-template-columns: minmax(0, 1fr) !important;
        }
        .ag-nav-meta {
          display: none;
        }
      }

      @media (max-width: 640px) {
        .ag-guide-shell {
          padding: 14px 14px 52px;
          gap: 20px;
        }
        .ag-arena-section {
          padding: 16px 14px;
        }
        .practice-pricing-card {
          padding: 18px 16px;
        }
        .practice-merged-table {
          font-size: 11.5px;
        }
        .practice-merged-table th,
        .practice-merged-table td {
          padding: 7px 7px;
        }
      }
    </style>
  </head>
  <body>
    <div id="guide-app"></div>
    <script src="./guide.js"></script>
  </body>
</html>
