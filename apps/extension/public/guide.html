<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyGrab — 30 秒新手实战教程 &amp; 练习靶场</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M16 9c.7 3.5 2.8 5.6 6.3 6.3-3.5.7-5.6 2.8-6.3 6.3-.7-3.5-2.8-5.6-6.3-6.3 3.5-.7 5.6-2.8 6.3-6.3z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-page: #07070c;
        --bg-surface: #10111a;
        --bg-elevated: #171826;
        --border-dim: rgba(255, 255, 255, 0.09);
        --text-bright: #f8fafc;
        --text-body: #cbd5e1;
        --text-muted: #94a3b8;
        --arena-cta: #4f46e5;
        --arena-cta-hover: #4338ca;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(900px 420px at 18% 0%, rgba(99, 102, 241, 0.18), transparent 60%),
          radial-gradient(800px 380px at 85% 5%, rgba(56, 189, 248, 0.12), transparent 58%),
          var(--bg-page);
        color: var(--text-bright);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Inter", "Segoe UI", sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .ag-guide-shell {
        max-width: 1140px;
        margin: 0 auto;
        padding: 22px 24px 72px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .ag-guide-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px;
        border-radius: 16px;
        background: rgba(16, 17, 26, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-dim);
        flex-wrap: wrap;
      }

      .ag-nav-brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .ag-nav-logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
      }

      .ag-nav-title {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .ag-nav-pill {
        font-size: 11.5px;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.14);
        border: 1px solid rgba(52, 211, 153, 0.35);
        color: #6ee7b7;
        font-weight: 600;
      }

      .ag-nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ag-btn-outline {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.05);
        color: #f1f5f9;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 140ms ease;
      }

      .ag-btn-outline:hover {
        background: rgba(99, 102, 241, 0.2);
        border-color: rgba(129, 140, 248, 0.5);
      }

      .ag-btn-lang {
        appearance: none;
        border: 1px solid rgba(56, 189, 248, 0.48);
        background: rgba(56, 189, 248, 0.15);
        color: #e0f2fe;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 140ms ease;
      }

      .ag-btn-lang:hover {
        background: rgba(56, 189, 248, 0.28);
        color: #ffffff;
      }

      .ag-hero {
        text-align: center;
        padding: 34px 26px;
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(30, 27, 75, 0.52) 0%, rgba(16, 17, 26, 0.92) 100%);
        border: 1px solid rgba(129, 140, 248, 0.26);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .ag-hero-badge {
        display: inline-block;
        padding: 4px 13px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.18);
        border: 1px solid rgba(129, 140, 248, 0.4);
        color: #c7d2fe;
        font-size: 12.5px;
        font-weight: 600;
      }

      .ag-hero-title {
        font-size: clamp(24px, 3.2vw, 34px);
        font-weight: 800;
        letter-spacing: -0.025em;
        max-width: 820px;
        line-height: 1.25;
      }

      .ag-hero-sub {
        font-size: 14.5px;
        color: var(--text-body);
        max-width: 780px;
      }

      .ag-btn-primary {
        appearance: none;
        border: 1px solid rgba(199, 210, 254, 0.45);
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #7c3aed 100%);
        color: #ffffff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 13px 24px;
        border-radius: 13px;
        cursor: pointer;
        box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
        transition: transform 120ms ease, filter 120ms ease;
        margin-top: 4px;
      }

      .ag-btn-primary:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .ag-section-heading {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.015em;
        margin-bottom: 14px;
      }

      .ag-steps-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      @media (max-width: 860px) {
        .ag-steps-grid,
        .ag-arena-targets {
          grid-template-columns: 1fr !important;
        }
      }

      .ag-step-card {
        padding: 20px;
        border-radius: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .ag-step-num {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, #6366f1, #38bdf8);
        color: #ffffff;
        font-weight: 800;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .ag-step-title {
        font-size: 15.5px;
        font-weight: 700;
        color: #ffffff;
      }

      .ag-step-desc {
        font-size: 13.5px;
        color: var(--text-body);
      }

      .ag-prompts-box {
        padding: 18px 20px;
        border-radius: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .ag-prompts-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 860px) {
        .ag-prompts-grid {
          grid-template-columns: 1fr;
        }
      }

      .ag-prompt-card {
        padding: 13px 14px;
        border-radius: 12px;
        background: #0b0c14;
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
      }

      .ag-prompt-label {
        font-size: 13px;
        font-weight: 700;
        color: #e0e7ff;
      }

      .ag-prompt-text {
        font-size: 12px;
        color: var(--text-muted);
      }

      .ag-prompt-copy {
        align-self: flex-start;
        appearance: none;
        border: 1px solid rgba(129, 140, 248, 0.4);
        background: rgba(99, 102, 241, 0.16);
        color: #c7d2fe;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 11px;
        border-radius: 7px;
        cursor: pointer;
      }

      .ag-prompt-copy[data-copied="true"] {
        background: rgba(16, 185, 129, 0.22);
        border-color: rgba(52, 211, 153, 0.55);
        color: #6ee7b7;
      }

      .ag-arena-section {
        padding: 24px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(17, 24, 39, 0.9) 0%, rgba(11, 12, 20, 0.96) 100%);
        border: 1px solid rgba(99, 102, 241, 0.35);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .ag-arena-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .ag-arena-sub {
        font-size: 13.5px;
        color: var(--text-body);
        max-width: 720px;
        margin-top: 4px;
      }

      .ag-capture-feedback {
        padding: 14px 16px;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px dashed rgba(148, 163, 184, 0.3);
        color: var(--text-body);
        font-size: 13px;
      }

      .ag-capture-feedback[data-captured="true"] {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.45);
        color: #ecfdf5;
      }

      .ag-capture-preview {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 9px;
        background: #07080e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        max-height: 170px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .ag-arena-targets {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 20px;
        align-items: start;
      }

      .ag-target-wrapper {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .ag-target-meta {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .ag-target-badge {
        display: inline-block;
        align-self: flex-start;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.2);
        color: #a5b4fc;
      }

      .ag-target-tip {
        font-size: 12px;
        color: #94a3b8;
      }

      /* Practice Target 1: Realistic Gradient SaaS Pricing Card */
      .practice-pricing-card {
        padding: 24px;
        border-radius: 18px;
        background: linear-gradient(145deg, #1e1b4b 0%, #0f172a 65%, #111827 100%);
        border: 1px solid #4338ca;
        box-shadow: 0 18px 38px rgba(15, 23, 42, 0.65);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .pricing-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .pricing-tier-name {
        font-size: 19px;
        font-weight: 800;
        color: #ffffff;
      }

      .pricing-pop-pill {
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.2);
        color: #7dd3fc;
        font-size: 11.5px;
        font-weight: 700;
      }

      .pricing-amount {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .pricing-price {
        font-size: 34px;
        font-weight: 800;
        color: #38bdf8;
      }

      .pricing-period {
        font-size: 13px;
        color: #94a3b8;
      }

      .pricing-features {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 9px;
        font-size: 13.5px;
        color: #e2e8f0;
      }

      .pricing-feature-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .practice-cta-btn {
        appearance: none;
        width: 100%;
        padding: 11px 16px;
        border-radius: 10px;
        border: none;
        background-color: var(--arena-cta);
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 140ms ease;
      }

      .practice-cta-btn:hover {
        background-color: var(--arena-cta-hover);
      }

      /* Practice Target 2: Merged-Header Financial Statement Table */
      .practice-table-card {
        padding: 18px;
        border-radius: 18px;
        background: #0f172a;
        border: 1px solid #334155;
        overflow-x: auto;
      }

      .practice-merged-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        color: #f1f5f9;
      }

      .practice-merged-table th,
      .practice-merged-table td {
        border: 1px solid #334155;
        padding: 10px 12px;
        text-align: left;
      }

      .practice-merged-table thead th {
        background: #1e293b;
        color: #e2e8f0;
        font-weight: 700;
      }

      .practice-growth-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.18);
        color: #34d399;
        font-weight: 700;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="guide-app"></div>
    <script src="./guide.js"></script>
  </body>
</html>
