<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyGrab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-base: #09090d;
        --bg-card: #12121a;
        --bg-card-hover: #181824;
        --bg-elevated: #1c1c2a;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(129, 140, 248, 0.35);
        --text-primary: #f8fafc;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent-indigo: #6366f1;
        --accent-violet: #8b5cf6;
        --accent-sky: #38bdf8;
        --accent-emerald: #34d399;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 376px;
        min-height: 460px;
        background:
          radial-gradient(120% 80% at 15% 0%, rgba(99, 102, 241, 0.16) 0%, transparent 58%),
          radial-gradient(100% 70% at 90% 10%, rgba(56, 189, 248, 0.1) 0%, transparent 52%),
          var(--bg-base);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .ag-popup {
        padding: 14px 15px 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .ag-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ag-logo-group {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .ag-logo-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.38);
      }

      .ag-title-wrap {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .ag-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #ffffff;
      }

      .ag-version {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        color: var(--text-muted);
      }

      .ag-engine-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(129, 140, 248, 0.25);
        color: #c7d2fe;
      }

      .ag-pick-cta {
        appearance: none;
        width: 100%;
        border: 1px solid rgba(165, 180, 252, 0.36);
        border-radius: 11px;
        padding: 11px 14px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 48%, #7c3aed 100%);
        color: #ffffff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        box-shadow:
          0 8px 24px rgba(99, 102, 241, 0.35),
          0 1px 0 rgba(255, 255, 255, 0.22) inset;
        transition: transform 110ms ease, filter 110ms ease, box-shadow 110ms ease;
      }

      .ag-pick-cta:hover {
        filter: brightness(1.07);
        box-shadow:
          0 10px 28px rgba(99, 102, 241, 0.48),
          0 1px 0 rgba(255, 255, 255, 0.28) inset;
      }

      .ag-pick-cta:active {
        transform: scale(0.99);
      }

      .ag-pick-cta-left {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .ag-shortcut-kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(9, 9, 13, 0.36);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #eef2ff;
      }

      .ag-status-banner {
        display: none;
        padding: 7px 10px;
        border-radius: 8px;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.35);
        color: #fcd34d;
        font-size: 11.5px;
      }

      .ag-status-banner[data-visible="true"] {
        display: block;
      }

      .ag-section {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 11px;
        padding: 10px 11px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .ag-section-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ag-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
      }

      .ag-segmented {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 3px;
        background: #0b0b11;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 9px;
      }

      .ag-seg-btn {
        appearance: none;
        border: none;
        border-radius: 6px;
        padding: 6px 4px;
        background: transparent;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 120ms ease;
      }

      .ag-seg-btn:hover {
        color: var(--text-primary);
      }

      .ag-seg-btn[data-active="true"] {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.92) 0%, rgba(124, 58, 237, 0.92) 100%);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
      }

      .ag-budget-readout {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .ag-budget-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        font-weight: 600;
        color: #c7d2fe;
      }

      .ag-unlimited-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        background: #0b0b11;
        color: var(--text-secondary);
        font-size: 11px;
        cursor: pointer;
        transition: all 120ms ease;
      }

      .ag-unlimited-chip[data-active="true"] {
        border-color: rgba(56, 189, 248, 0.45);
        background: rgba(56, 189, 248, 0.14);
        color: #bae6fd;
      }

      .ag-unlimited-chip input {
        accent-color: #38bdf8;
        cursor: pointer;
      }

      .ag-slider-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: opacity 120ms ease;
      }

      .ag-slider-wrap[data-disabled="true"] {
        opacity: 0.38;
        pointer-events: none;
      }

      .ag-slider {
        width: 100%;
        accent-color: #6366f1;
        cursor: pointer;
        height: 5px;
      }

      .ag-slider-ticks {
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        color: var(--text-muted);
      }

      .ag-toggles-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .ag-toggle-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 9px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }

      .ag-toggle-card:hover {
        background: var(--bg-card-hover);
        border-color: rgba(255, 255, 255, 0.14);
      }

      .ag-toggle-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .ag-toggle-sub {
        font-size: 10px;
        color: var(--text-muted);
      }

      .ag-switch {
        position: relative;
        width: 32px;
        height: 18px;
        flex-shrink: 0;
      }

      .ag-switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .ag-switch-track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #272736;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: background 140ms ease, border-color 140ms ease;
      }

      .ag-switch-track::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        top: 2px;
        left: 2px;
        border-radius: 50%;
        background: #d4d4d8;
        transition: transform 140ms ease, background 140ms ease;
      }

      .ag-switch input:checked + .ag-switch-track {
        background: #6366f1;
        border-color: #818cf8;
      }

      .ag-switch input:checked + .ag-switch-track::after {
        transform: translateX(14px);
        background: #ffffff;
      }

      .ag-history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ag-history-title-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .ag-count-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-secondary);
      }

      .ag-clear-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: transparent;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 120ms ease;
      }

      .ag-clear-btn:hover:not(:disabled) {
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.4);
        background: rgba(239, 68, 68, 0.12);
      }

      .ag-clear-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .ag-history-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 196px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .ag-history-list::-webkit-scrollbar {
        width: 5px;
      }

      .ag-history-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
      }

      .ag-empty-history {
        padding: 18px 12px;
        text-align: center;
        border-radius: 9px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        font-size: 11.5px;
      }

      .ag-history-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 9px;
        border-radius: 9px;
        background: #0d0d14;
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: border-color 120ms ease;
      }

      .ag-history-item:hover {
        border-color: rgba(129, 140, 248, 0.3);
      }

      .ag-history-meta {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .ag-history-top {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .ag-domain {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 120px;
      }

      .ag-tag-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        color: #a5b4fc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 135px;
      }

      .ag-history-bottom {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
      }

      .ag-fmt-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(99, 102, 241, 0.16);
        color: #c7d2fe;
      }

      .ag-ratio-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(52, 211, 153, 0.28);
        color: var(--accent-emerald);
      }

      .ag-tokens-muted {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        color: var(--text-muted);
      }

      .ag-copy-btn {
        appearance: none;
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        cursor: pointer;
        transition: all 120ms ease;
      }

      .ag-copy-btn:hover {
        background: rgba(99, 102, 241, 0.24);
        border-color: rgba(129, 140, 248, 0.5);
      }

      .ag-copy-btn[data-copied="true"] {
        background: rgba(16, 185, 129, 0.2);
        border-color: rgba(52, 211, 153, 0.55);
        color: #6ee7b7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./popup.js"></script>
  </body>
</html>
