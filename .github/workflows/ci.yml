name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  verify:
    name: Typecheck, Test, Build & Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify @anygrab/core has zero runtime dependencies
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("packages/core/package.json", "utf8"));
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error("@anygrab/core must have zero runtime dependencies, found:", deps);
              process.exit(1);
            }
          '

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

      - name: Build all packages & apps
        run: pnpm build

      - name: Run AnyGrab-Bench evaluation suite
        run: pnpm bench
